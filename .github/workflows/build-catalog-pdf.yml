name: Build Wholesale Catalog PDF

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"

permissions:
  contents: write

jobs:
  build-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Start catalog locally
        run: |
          python3 -m http.server 8000 > /tmp/catalog-server.log 2>&1 &
          sleep 3

      - name: Generate and verify catalog.pdf
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              acceptDownloads: true,
              viewport: { width: 1440, height: 1000 }
            });
            const page = await context.newPage();

            page.on('console', msg => {
              if (msg.text()) console.log(`[browser:${msg.type()}] ${msg.text()}`);
            });
            page.on('pageerror', err => console.error('[browser error]', err));
            page.on('dialog', async dialog => {
              console.log(`[dialog] ${dialog.message()}`);
              await dialog.dismiss();
            });

            const pdfDownloadPromise = new Promise((resolve, reject) => {
              const timer = setTimeout(() => reject(new Error('Timed out waiting for catalog.pdf')), 15 * 60 * 1000);

              page.on('download', async download => {
                const suggested = download.suggestedFilename();
                console.log(`[download] ${suggested}`);

                if (suggested.toLowerCase().endsWith('.pdf')) {
                  clearTimeout(timer);
                  resolve(download);
                } else {
                  console.log(`[download] Ignoring non-PDF download: ${suggested}`);
                  try { await download.cancel(); } catch (_) {}
                }
              });
            });

            await page.goto(
              'http://127.0.0.1:8000/index.html?buildCatalogPdf=1',
              { waitUntil: 'domcontentloaded', timeout: 120000 }
            );

            const download = await pdfDownloadPromise;
            await download.saveAs('catalog.pdf');

            const bytes = fs.readFileSync('catalog.pdf');
            const signature = bytes.subarray(0, 5).toString('ascii');

            if (signature !== '%PDF-') {
              throw new Error(`Invalid PDF signature: ${JSON.stringify(signature)}. File is not a real PDF.`);
            }
            if (bytes.length < 20000) {
              throw new Error(`catalog.pdf is unexpectedly small (${bytes.length} bytes).`);
            }

            console.log(`Valid catalog.pdf created: ${bytes.length} bytes`);
            await browser.close();
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE

      - name: Verify PDF file again
        run: |
          test -s catalog.pdf
          test "$(head -c 5 catalog.pdf)" = "%PDF-"
          ls -lh catalog.pdf

      - name: Commit refreshed catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.pdf
          if git diff --cached --quiet; then
            echo "No catalog PDF change."
          else
            git commit -m "Refresh wholesale catalog PDF"
            git push
          fi
